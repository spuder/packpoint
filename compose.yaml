# Corrected Docker Compose file for Packpoint with Tailscale sidecar

services:
  # The main application container
  packpoint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packpoint
    restart: unless-stopped
    # Pulls in every var from .env (TINDIE_*, EASYPOST_*, STRIPE_STORE_*_*,
    # CUPS_HOST, ...) so new stores/vars don't need a matching line added
    # here. `environment:` below still wins over env_file for any key it
    # also sets, which is how the dev-mode values in .env get overridden
    # for this production container.
    env_file:
      - .env
    environment:
      - TZ=America/Denver
      - RACK_ENV=production
      - APP_ENV=production
      - DEPLOY_ENV=production
      - RAILS_ENV=production
      - ALLOWED_HOSTS=packpoint.snowy-vibes.ts.net,packpoint.local,localhost
    # ports:
    #   - "9292:9292"
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=packpoint"
      - "docktail.service.port=9292"
      - "docktail.service.service-port=443"
